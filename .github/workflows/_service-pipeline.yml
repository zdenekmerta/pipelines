name: Service pipeline template

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      deployment: ${{ steps.filter.outputs.deployment }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}

    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - 'services/${{ inputs.service }}/**'

            deployment-code:
              - 'ops/services/${{ inputs.service }}/deployment/**'
              - '!ops/services/${{ inputs.service }}/deployment/Pulumi.*.yaml'

            deployment-config-ppe:
              - 'ops/services/${{ inputs.service }}/deployment/Pulumi.prod.yaml'

            deployment-config-prod:
              - 'ops/services/${{ inputs.service }}/deployment/Pulumi.ppe.yaml'

            infrastructure-code:
              - 'ops/services/${{ inputs.service }}/infrastructure/**'
              - '!ops/services/${{ inputs.service }}/infrastructure/Pulumi.*.yaml'

            infrastructure-config-ppe:
              - 'ops/services/${{ inputs.service }}/infrastructure/Pulumi.ppe.yaml'

            infrastructure-config-prod:
              - 'ops/services/${{ inputs.service }}/infrastructure/Pulumi.prod.yaml'

  build:
    needs:
      - changes
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - id: meta
        run: |
          TAG=$(date +%s)
          IMAGE="${{ inputs.service }}:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          echo "Build image: ${{ steps.meta.outputs.image }}"

      - name: Push image
        run: |
          echo "Push image: ${{ steps.meta.outputs.image }}"

  ppe:
    needs:
      - changes
      - build
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.build == 'true' ||
        needs.changes.outputs.infrastructure-code == 'true' ||
        needs.changes.outputs.infrastructure-config-ppe == 'true' ||
        needs.changes.outputs.deployment-code == 'true' ||
        needs.changes.outputs.deployment-config-ppe == 'true'

      )
    environment:
      name: ppe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Provision infrastructure
        if: |
          needs.changes.outputs.infrastructure-code == 'true' ||
          needs.changes.outputs.infrastructure-config-ppe == 'true'
        run: |
          echo "Provision infrastructure: ${{ inputs.service }}"

      - name: Deploy service
        if: |
          needs.changes.outputs.build == 'true' ||
          needs.changes.outputs.deployment-code == 'true' ||
          needs.changes.outputs.deployment-config-ppe == 'true'
        run: |
          echo "Deploy service: ${{ needs.build.outputs.image }}"

  prod:
    needs:
      - changes
      - build
      - ppe
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.build == 'true' ||
        needs.changes.outputs.infrastructure-code == 'true' ||
        needs.changes.outputs.infrastructure-config-prod == 'true' ||
        needs.changes.outputs.deployment-code == 'true' ||
        needs.changes.outputs.deployment-config-prod == 'true'
      ) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.ppe.result == 'success' || needs.ppe.result == 'skipped')
    environment:
      name: prod
    concurrency:
      group: prod-${{ inputs.service }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Provision infrastructure
        if: |
          needs.changes.outputs.infrastructure-code == 'true' ||
          needs.changes.outputs.infrastructure-config-prod == 'true'
        run: |
          echo "Provision infrastructure: ${{ inputs.service }}"

      - name: Deploy service
        if: |
          needs.changes.outputs.build == 'true' ||
          needs.changes.outputs.deployment-code == 'true' ||
          needs.changes.outputs.deployment-config-prod == 'true'
        run: |
          echo "Deploy service: ${{ needs.build.outputs.image }}"
